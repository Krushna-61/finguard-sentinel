global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@finguard.com'
  smtp_auth_username: 'alerts@finguard.com'
  smtp_auth_password: 'your_password_here'

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      continue: true
    - match:
        severity: warning
      receiver: 'warning'

receivers:
  - name: 'default'
    email_configs:
      - to: 'team@finguard.com'
        headers:
          Subject: '[FinGuard] {{ .GroupLabels.alertname }}'
  
  - name: 'critical'
    email_configs:
      - to: 'oncall@finguard.com'
        headers:
          Subject: '[CRITICAL] {{ .GroupLabels.alertname }}'
    # Slack webhook (optional)
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'
    #     channel: '#alerts-critical'
    #     title: 'Critical Alert'
  
  - name: 'warning'
    email_configs:
      - to: 'team@finguard.com'
        headers:
          Subject: '[WARNING] {{ .GroupLabels.alertname }}'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']
